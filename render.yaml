services:
  - type: web
    name: botanic-api
    env: docker
    dockerfilePath: backend/Dockerfile
    plan: starter
    region: oregon
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PROJECT_NAME
        value: "Botanic Premium Marketplace API"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
    healthCheckPath: /health

  - type: worker
    name: botanic-worker
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerCommand: "arq app.workers.WorkerSettings"
    plan: starter
    region: oregon
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromService:
          name: botanic-api
          type: web
          envVarKey: DATABASE_URL
      - key: REDIS_URL
        fromService:
          name: botanic-api
          type: web
          envVarKey: REDIS_URL
